<form method="POST" action="{{ url_for('courses.assign_students', course_id=course.id) }}">
  <div class="form-group">
    <label>Sélectionner les étudiants</label>
    <div class="checkbox-list">
      {% for s in students %}
      <label class="checkbox-item">
        <input type="checkbox" name="student_ids" value="{{ s.id }}"
               {% if s.id in course.student_ids %}checked{% endif %} />
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:.84rem;color:var(--text)">{{ s.name }}</div>
          <div style="font-size:.73rem;color:var(--text-3)">{{ s.email }}</div>
        </div>
        {% if s.id in course.student_ids %}
          <span class="badge badge-green" style="font-size:.65rem">Inscrit</span>
        {% endif %}
      </label>
      {% endfor %}
    </div>
  </div>
  <button type="submit" class="btn btn-accent btn-sm">
    <i class="fas fa-users"></i> Mettre à jour
  </button>
</form>
