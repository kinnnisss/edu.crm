{% extends 'base.html' %}
{% block title %}Nouveau cours{% endblock %}
{% block page_title %}Nouveau cours{% endblock %}

{% block content %}

<div class="section-header">
  <h2>
    <i class="fas fa-plus" style="font-size:1rem;color:var(--gold)"></i>
    Créer un cours
  </h2>
  <a href="{{ url_for('courses.index') }}" class="btn btn-secondary">
    <i class="fas fa-arrow-left"></i> Retour
  </a>
</div>

<div style="max-width:540px">
  <div class="dash-card">
    <form method="POST" action="{{ url_for('courses.add') }}">

      <div class="form-group">
        <label>Titre du cours</label>
        <input type="text" name="title" placeholder="Ex : Algorithmique avancée" required />
      </div>

      <div class="form-actions" style="padding-top:6px">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-check"></i> Créer le cours
        </button>
        <a href="{{ url_for('courses.index') }}" class="btn btn-secondary">Annuler</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
