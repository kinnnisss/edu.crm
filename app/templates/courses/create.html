{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 720px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Ajouter un cours</h2>
    <a class="btn btn-light border" href="{{ url_for('courses.index') }}">Retour</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="POST" action="{{ url_for('courses.create') }}" class="row g-2">
        <div class="col-12">
          <label class="form-label">Titre</label>
          <input type="text" name="title" class="form-control"
                 placeholder="Ex: Algorithmique" required>
        </div>
        <div class="col-12">
          <button class="btn btn-primary w-100" type="submit">Créer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
